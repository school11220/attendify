<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Attendify - Interactive Calendar</title>
    <style>
    #nprogress-bar { position:fixed;top:0;left:0;height:2px;background:#ff3b3b;z-index:9999;transition:width 0.3s ease,opacity 0.3s ease;width:0%;opacity:0; }
    </style>
    <link rel="icon" href="/logo.png" type="image/png">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#050505">

    <!-- Clerk Auth -->
    <script src="/auth/clerk.js"></script>


    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css">

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff3b3b",
                        "accent-red": "#ff4d4d",
                        "dark-red": "#7a0000",
                        "deep-bg": "#050505",
                        "card-bg": "#0d0d0d",
                        "border-color": "#1f1f1f",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
</head>

<body class="dark bg-deep-bg text-white font-display min-h-screen flex flex-col" x-data="calendarData()"
    x-init="initData()">
    <div id="nprogress-bar"></div>

    <!-- Header Navigation -->
    <header
        class="hidden md:flex items-center justify-between border-b border-border-color bg-deep-bg px-4 sm:px-10 py-4 sticky top-0 z-50">
        <div class="flex items-center gap-4 sm:gap-10">
            <div class="flex items-center gap-3 text-primary">
                <span class="material-symbols-outlined text-3xl font-black">analytics</span>
                <h2
                    class="text-white text-lg sm:text-xl font-black uppercase tracking-[0.2em] leading-tight hidden sm:block">
                    Attendify</h2>
            </div>
        </div>

        <div class="flex flex-1 justify-end gap-4 sm:gap-6 sm:gap-10 items-center">
            <nav class="hidden md:flex items-center gap-8">
                <a class="text-neutral-500 hover:text-white transition-all text-[10px] sm:text-xs font-bold uppercase tracking-widest"
                    href="/" onclick="startNav()">Dashboard</a>
                <a class="text-primary border-b border-primary py-1 text-[10px] sm:text-xs font-bold uppercase tracking-widest"
                    href="/calendar" onclick="startNav()">Calendar</a>
                <a class="text-neutral-500 hover:text-white transition-all text-[10px] sm:text-xs font-bold uppercase tracking-widest"
                    href="/calculator" onclick="startNav()">Calculator</a>
                <a class="text-neutral-500 hover:text-white transition-all text-[10px] sm:text-xs font-bold uppercase tracking-widest"
                    href="/profile" onclick="startNav()">Profile</a>
            </nav>
            <div class="hidden">
                <div id="user-button"></div>
            </div>
        </div>
    </header>

    <!-- Mobile Bottom Nav -->
    <nav
        class="md:hidden fixed bottom-0 left-0 right-0 bg-deep-bg border-t border-border-color z-50 flex justify-around items-center pt-2 pb-4 px-2 shadow-[0_-10px_40px_rgba(0,0,0,0.8)]">
        <a href="/" onclick="startNav()" class="flex flex-col items-center gap-1 p-2 text-neutral-500 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-[24px]">home</span>
            <span class="text-[9px] font-black uppercase tracking-widest">Home</span>
        </a>
        <a href="/calendar" onclick="startNav()" class="flex flex-col items-center gap-1 p-2 text-primary">
            <span class="material-symbols-outlined text-[24px]">calendar_month</span>
            <span class="text-[9px] font-black uppercase tracking-widest">Calendar</span>
        </a>
        <a href="/calculator" onclick="startNav()" class="flex flex-col items-center gap-1 p-2 text-neutral-500 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-[24px]">calculate</span>
            <span class="text-[9px] font-black uppercase tracking-widest">Calc</span>
        </a>
        <a href="/profile" onclick="startNav()"
            class="flex flex-col items-center gap-1 p-2 text-neutral-500 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-[24px]">person</span>
            <span class="text-[9px] font-black uppercase tracking-widest">Profile</span>
        </a>
    </nav>

    <main class="flex-1 mx-auto w-full max-w-5xl px-4 sm:px-10 pt-4 sm:pt-10 pb-24 md:pb-10" id="main-content"
        x-show="!loading" style="opacity: 0; transition: opacity 0.5s ease;">

        <div class="flex flex-col gap-2 mb-6 sm:mb-10">
            <h1 class="text-white text-3xl sm:text-5xl font-black leading-none tracking-tighter uppercase">Interactive
                Calendar</h1>
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 sm:gap-8">
            <!-- Sidebar for Subjects List -->
            <div class="md:col-span-1 rounded bg-card-bg border border-border-color p-4 flex flex-col gap-2 neo-shadow">
                <h3
                    class="text-white text-xs font-black uppercase tracking-[0.2em] mb-4 border-l-2 border-primary pl-2">
                    Filter By Subject</h3>

                <template x-for="subject in subjects" :key="subject.id">
                    <button @click="selectSubject(subject)"
                        class="text-left w-full px-4 py-3 rounded text-xs font-bold transition-all border border-transparent"
                        :class="selectedSubject && selectedSubject.id === subject.id ? 'bg-primary border-primary text-white shadow-[0_0_15px_rgba(255,59,59,0.3)]' : 'bg-white/5 text-neutral-400 hover:bg-white/10'">
                        <span class="uppercase tracking-widest block truncate text-left" x-text="subject.subject_name"></span>
                        <span class="text-[9px] font-bold mt-0.5 block"
                            :class="subject.current_percentage >= subject.min_requirement_percentage ? 'text-green-400/70' : 'text-primary/70'"
                            x-text="subject.current_percentage + '%'"></span>
                    </button>
                </template>
                <template x-if="subjects.length === 0">
                    <div class="text-center text-neutral-500 text-xs italic py-4">No subjects found</div>
                </template>
            </div>

            <!-- Main Interactive Log Area -->
            <div
                class="md:col-span-3 rounded bg-card-bg border border-border-color p-4 sm:p-6 neo-shadow flex flex-col relative">
                <template x-if="!selectedSubject">
                    <div
                        class="flex-1 flex flex-col items-center justify-center p-10 mt-12 text-center text-neutral-500">
                        <span class="material-symbols-outlined text-6xl mb-4">date_range</span>
                        <p class="uppercase tracking-widest text-xs font-bold">Select a subject from the list to view
                            its calendar.</p>
                    </div>
                </template>

                <template x-if="selectedSubject">
                    <div>
                        <div class="flex flex-wrap justify-between items-center mb-6 pb-4 border-b border-border-color gap-3">
                            <h2 class="text-base sm:text-2xl font-black uppercase text-white truncate max-w-[160px] sm:max-w-xs"
                                x-text="selectedSubject.subject_name"></h2>
                            <div class="flex items-center gap-2 sm:gap-4 flex-shrink-0">
                                <button @click="changeMonth(-1)"
                                    class="w-8 h-8 flex items-center justify-center rounded border border-border-color bg-deep-bg hover:text-primary transition-all"><span
                                        class="material-symbols-outlined text-sm">chevron_left</span></button>
                                <span
                                    class="text-[11px] sm:text-sm font-black uppercase tracking-widest text-neutral-300 w-24 sm:w-32 text-center"
                                    x-text="currentMonthName + ' ' + currentYear"></span>
                                <button @click="goToToday()" class="text-[9px] font-black uppercase tracking-widest border border-border-color px-2 py-1 rounded hover:border-primary hover:text-primary transition-all text-neutral-500">Today</button>
                                <button @click="changeMonth(1)"
                                    class="w-8 h-8 flex items-center justify-center rounded border border-border-color bg-deep-bg hover:text-primary transition-all"><span
                                        class="material-symbols-outlined text-sm">chevron_right</span></button>
                            </div>
                        </div>

                        <!-- Calendar Grid -->
                        <div class="grid grid-cols-7 gap-1 text-center mb-2">
                            <template x-for="day in ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']">
                                <div class="text-[10px] font-black uppercase tracking-widest text-neutral-500 py-2"
                                    x-text="day"></div>
                            </template>
                        </div>

                        <div class="grid grid-cols-7 gap-1">
                            <!-- Blank days — weekend columns get a subtle tint -->
                            <template x-for="(blank, index) in blankDays" :key="'b'+index">
                                <div class="aspect-square rounded border border-border-color opacity-20"
                                    :class="(7 - blankDays.length + index) % 7 === 0 || (7 - blankDays.length + index) % 7 === 6 ? 'bg-white/5' : 'bg-deep-bg/50'">
                                </div>
                            </template>

                            <!-- Days of month -->
                            <template x-for="day in daysInMonth">
                                <div @click="openDateAction(day)"
                                    class="aspect-square rounded border border-border-color flex flex-col items-center justify-center relative group cursor-pointer transition-all hover:scale-[1.03] active:scale-95 shadow-sm"
                                    :class="getDayStatusClass(day)">
                                    <span class="text-xs sm:text-sm font-bold z-10" x-text="day"></span>
                                    <!-- Indicator dot -->
                                    <div x-show="hasRecord(day)"
                                        class="absolute bottom-2 w-1.5 h-1.5 rounded-full z-10 indicator-pulse"
                                        :class="getIndicatorClass(day)"></div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Date Action Modal Overlay inside the main view for quick actions -->
        <div x-show="isActionModalOpen" style="display:none;"
            class="fixed inset-0 z-[100] flex justify-center items-center px-4">
            <div class="fixed inset-0 bg-black/80 backdrop-blur-sm transition-opacity" @click="closeActionModal()">
            </div>

            <div
                class="bg-card-bg border-t-2 border-t-primary border-r border-b border-l border-border-color rounded-xl p-6 z-10 transform transition-all w-full max-w-sm shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h3 class="text-xs font-black uppercase tracking-widest text-neutral-500">Selected Date</h3>
                        <p class="text-xl font-black text-white" x-text="formatSelectedDateString()"></p>
                    </div>
                    <button @click="closeActionModal()" class="text-neutral-500 hover:text-white transition-all"><span
                            class="material-symbols-outlined">close</span></button>
                </div>

                <!-- Future date warning -->
                <template x-if="isFutureDate(activeDate)">
                    <div class="mb-4 p-2 bg-orange-500/10 border border-orange-500/30 rounded flex items-center gap-2">
                        <span class="material-symbols-outlined text-orange-500 text-[16px]">warning</span>
                        <span class="text-orange-500 text-[10px] font-black uppercase tracking-widest">Future date — are you sure?</span>
                    </div>
                </template>

                <!-- Existing records list for the date -->
                <div x-show="activeDateRecords.length > 0" class="mb-6">
                    <p
                        class="text-[10px] uppercase font-black tracking-widest text-neutral-500 mb-2 border-b border-border-color pb-2">
                        Existing Records</p>
                    <div class="flex flex-col gap-2">
                        <template x-for="rec in activeDateRecords" :key="rec.id">
                            <div
                                class="flex items-center justify-between p-3 bg-deep-bg border border-border-color rounded">
                                <div class="flex items-center gap-2">
                                    <span class="material-symbols-outlined text-sm" :class="statusTextColor(rec.status)"
                                        x-text="statusIcon(rec.status)"></span>
                                    <span class="text-xs font-black uppercase tracking-widest"
                                        :class="statusTextColor(rec.status)" x-text="rec.status"></span>
                                </div>
                                <button @click="deleteRecord(rec.id)"
                                    class="text-neutral-500 hover:text-primary transition-all"><span
                                        class="material-symbols-outlined text-[16px]">delete</span></button>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div>
                    <p
                        class="text-[10px] uppercase font-black tracking-widest text-neutral-500 mb-2 border-b border-border-color pb-2">
                        Log New Attendance</p>
                    <div class="grid grid-cols-3 gap-2">
                        <button @click="submitLog('present')"
                            class="flex flex-col items-center justify-center p-3 rounded border border-transparent bg-white/5 hover:bg-green-500/20 hover:text-green-500 hover:border-green-500/50 transition-all text-neutral-400">
                            <span class="material-symbols-outlined mb-1">check_circle</span>
                            <span class="text-[9px] font-black uppercase tracking-widest">Present</span>
                        </button>
                        <button @click="submitLog('absent')"
                            class="flex flex-col items-center justify-center p-3 rounded border border-transparent bg-white/5 hover:bg-primary/20 hover:text-primary hover:border-primary/50 transition-all text-neutral-400">
                            <span class="material-symbols-outlined mb-1">cancel</span>
                            <span class="text-[9px] font-black uppercase tracking-widest">Absent</span>
                        </button>
                        <button @click="submitLog('extra')"
                            class="flex flex-col items-center justify-center p-3 rounded border border-transparent bg-white/5 hover:bg-blue-500/20 hover:text-blue-500 hover:border-blue-500/50 transition-all text-neutral-400">
                            <span class="material-symbols-outlined mb-1">add_circle</span>
                            <span class="text-[9px] font-black uppercase tracking-widest">Extra</span>
                        </button>
                    </div>
                </div>

                <!-- Holiday toggle -->
                <div class="mt-4 pt-4 border-t border-border-color">
                    <p class="text-[10px] uppercase font-black tracking-widest text-neutral-500 mb-2 border-b border-border-color pb-2">Holiday</p>
                    <button @click="toggleHoliday(getFullDateStringForDay(activeDate)); activeDateRecords = getRecordsForDay(activeDate);"
                        class="w-full flex items-center justify-center gap-2 p-3 rounded border transition-all"
                        :class="isHoliday(activeDate) ? 'bg-yellow-500/20 border-yellow-500/50 text-yellow-500' : 'bg-white/5 border-border-color text-neutral-400 hover:bg-yellow-500/10 hover:border-yellow-500/30 hover:text-yellow-500'">
                        <span class="material-symbols-outlined text-[18px]">beach_access</span>
                        <span class="text-[9px] font-black uppercase tracking-widest" x-text="isHoliday(activeDate) ? 'Remove Holiday' : 'Mark as Holiday'"></span>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script src="/js/main.js"></script>
    <script>
        function startNav(e, el) {
            const bar = document.getElementById('nprogress-bar');
            bar.style.opacity = '1';
            bar.style.width = '60%';
        }

        document.addEventListener('alpine:init', () => {
            Alpine.data('calendarData', () => ({
                loading: true,

                subjects: [],
                selectedSubject: null,
                history: [],

                // Holidays stored in localStorage { "YYYY-MM-DD": true }
                holidays: {},

                // Calendar State
                currentMonth: new Date().getMonth(),
                currentYear: new Date().getFullYear(),
                daysInMonth: [],
                blankDays: [],

                // Modal State
                isActionModalOpen: false,
                activeDate: null,
                activeDateRecords: [],

                monthNames: ["January","February","March","April","May","June","July","August","September","October","November","December"],

                async initData() {
                    window.addEventListener('load', async () => {
                        const clerk = await window.waitForClerk();
                        if (!clerk) {
                            this.loading = false;
                            return;
                        }
                        const userButtonDiv = document.getElementById('user-button');
                        if (clerk.user) {
                            clerk.mountUserButton(userButtonDiv);
                            document.getElementById('main-content').style.opacity = '1';
                            const bar = document.getElementById('nprogress-bar');
                            bar.style.opacity = '1'; bar.style.width = '70%';
                            this.loadHolidays();
                            await this.fetchSubjects();
                            this.getDays();
                            bar.style.width = '100%';
                            setTimeout(() => { bar.style.opacity = '0'; bar.style.width = '0%'; }, 400);
                        } else {
                            window.location.href = '/sign-in';
                        }
                    });
                },

                get currentMonthName() {
                    return this.monthNames[this.currentMonth];
                },

                getDays() {
                    const daysInMonth = new Date(this.currentYear, this.currentMonth + 1, 0).getDate();
                    const dayOfWeek = new Date(this.currentYear, this.currentMonth, 1).getDay();
                    this.blankDays = Array.from({ length: dayOfWeek }, (_, i) => i);
                    this.daysInMonth = Array.from({ length: daysInMonth }, (_, i) => i + 1);
                },

                changeMonth(delta) {
                    this.currentMonth += delta;
                    if (this.currentMonth < 0) { this.currentMonth = 11; this.currentYear--; }
                    if (this.currentMonth > 11) { this.currentMonth = 0; this.currentYear++; }
                    this.getDays();
                },

                goToToday() {
                    this.currentMonth = new Date().getMonth();
                    this.currentYear = new Date().getFullYear();
                    this.getDays();
                },

                async fetchSubjects() {
                    try {
                        const response = await fetch('/api/subjects');
                        this.subjects = await response.json();
                        // Auto-select the first subject
                        if (this.subjects.length > 0) {
                            await this.selectSubject(this.subjects[0]);
                        }
                    } catch (err) {
                        console.error(err);
                        window.showToast('Failed to load subjects', 'error');
                    } finally {
                        this.loading = false;
                    }
                },

                async selectSubject(subject) {
                    this.selectedSubject = subject;
                    try {
                        const response = await fetch(`/api/subjects/${subject.id}`);
                        const data = await response.json();
                        this.history = data.history;
                        this.selectedSubject = data.subject;
                    } catch (err) {
                        console.error(err);
                        window.showToast('Failed to load history', 'error');
                    }
                },

                // ── Holiday helpers ───────────────────────────────────────
                loadHolidays() {
                    try {
                        const saved = localStorage.getItem('attendify_holidays');
                        if (saved) this.holidays = JSON.parse(saved);
                    } catch(e) { this.holidays = {}; }
                },

                isHoliday(day) {
                    if (!day) return false;
                    const dow = new Date(this.currentYear, this.currentMonth, day).getDay();
                    if (dow === 0 || dow === 6) return true; // Sunday or Saturday
                    return !!this.holidays[this.getFullDateStringForDay(day)];
                },

                toggleHoliday(dateStr) {
                    if (this.holidays[dateStr]) {
                        delete this.holidays[dateStr];
                    } else {
                        this.holidays[dateStr] = true;
                    }
                    this.holidays = { ...this.holidays }; // trigger Alpine reactivity
                    localStorage.setItem('attendify_holidays', JSON.stringify(this.holidays));
                },

                // ── Calendar Visual Helpers ───────────────────────────────
                getFullDateStringForDay(day) {
                    const d = new Date(this.currentYear, this.currentMonth, day);
                    const offset = d.getTimezoneOffset();
                    d.setMinutes(d.getMinutes() - offset);
                    return d.toISOString().split('T')[0];
                },

                getRecordsForDay(day) {
                    if (!this.history) return [];
                    const dString = this.getFullDateStringForDay(day);
                    return this.history.filter(h => h.date === dString);
                },

                hasRecord(day) {
                    return this.getRecordsForDay(day).length > 0 || this.isHoliday(day);
                },

                getDayStatusClass(day) {
                    // Holiday takes highest priority
                    if (this.isHoliday(day)) return "bg-yellow-500/10 border-yellow-500/30 text-yellow-400";

                    const todayStr = window.getLocalDateString();
                    const thisDayStr = this.getFullDateStringForDay(day);
                    const dow = new Date(this.currentYear, this.currentMonth, day).getDay();
                    const isWeekend = dow === 0 || dow === 6;

                    let baseClass = isWeekend ? "bg-white/[0.02] border-white/5" : "bg-deep-bg";
                    if (todayStr === thisDayStr) baseClass = "bg-white/10 border-white/50";

                    const records = this.getRecordsForDay(day);
                    if (records.length === 0) return baseClass;

                    const hasAbsent  = records.some(r => r.status === 'absent');
                    const hasPresent = records.some(r => r.status === 'present');
                    const hasExtra   = records.some(r => r.status === 'extra');

                    if (hasAbsent)  return "bg-primary/5 hover:bg-primary/20 border-primary/20 text-white";
                    if (hasPresent) return "bg-green-500/5 hover:bg-green-500/20 border-green-500/20 text-white";
                    if (hasExtra)   return "bg-blue-500/5 hover:bg-blue-500/20 border-blue-500/20 text-white";

                    return baseClass;
                },

                getIndicatorClass(day) {
                    if (this.isHoliday(day)) return "bg-yellow-500";
                    const records = this.getRecordsForDay(day);
                    if (records.length === 0) return "";
                    const hasAbsent  = records.some(r => r.status === 'absent');
                    const hasPresent = records.some(r => r.status === 'present');
                    if (hasAbsent)  return "bg-primary";
                    if (hasPresent) return "bg-green-500";
                    return "bg-blue-500";
                },

                isFutureDate(day) {
                    if (!day) return false;
                    const today = new Date(); today.setHours(0,0,0,0);
                    const selected = new Date(this.currentYear, this.currentMonth, day);
                    return selected > today;
                },

                // ── Modal Interactions ────────────────────────────────────
                openDateAction(day) {
                    this.activeDate = day;
                    this.activeDateRecords = this.getRecordsForDay(day);
                    this.isActionModalOpen = true;
                },

                closeActionModal() {
                    this.isActionModalOpen = false;
                    this.activeDate = null;
                },

                formatSelectedDateString() {
                    if (!this.activeDate) return "";
                    const d = new Date(this.currentYear, this.currentMonth, this.activeDate);
                    return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                },

                async submitLog(status) {
                    const dateString = this.getFullDateStringForDay(this.activeDate);
                    try {
                        const res = await fetch('/api/attendance/mark', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ subjectId: this.selectedSubject.id, status, date: dateString })
                        });
                        if (res.ok) {
                            window.showToast("Attendance Saved", "success");
                            await this.selectSubject(this.selectedSubject);
                            this.activeDateRecords = this.getRecordsForDay(this.activeDate);
                        } else {
                            window.showToast("Failed to save", "error");
                        }
                    } catch (e) {
                        console.error('Error adding log', e);
                        window.showToast("Communication error", "error");
                    }
                },

                async deleteRecord(recordId) {
                    try {
                        const res = await fetch(`/api/attendance/${this.selectedSubject.id}/${recordId}`, { method: 'DELETE' });
                        if (res.ok) {
                            window.showToast('Record Deleted', 'success');
                            await this.selectSubject(this.selectedSubject);
                            this.activeDateRecords = this.getRecordsForDay(this.activeDate);
                        } else {
                            window.showToast('Failed to delete', 'error');
                        }
                    } catch (e) {
                        console.error('Error deleting', e);
                        window.showToast('Communication Error', 'error');
                    }
                },

                statusTextColor(status) {
                    if (status === 'present') return 'text-green-500';
                    if (status === 'absent')  return 'text-primary';
                    if (status === 'extra')   return 'text-blue-500';
                    return 'text-white';
                },

                statusIcon(status) {
                    if (status === 'present') return 'check';
                    if (status === 'absent')  return 'close';
                    if (status === 'extra')   return 'add';
                    return 'info';
                }
            }));
        });
    </script>
    <!-- Toast container - fixed popup below any header -->
    <div id="toast-container"
        class="fixed top-20 right-4 z-[9999] flex flex-col gap-2 pointer-events-none w-72 max-w-[calc(100vw-2rem)]">
