<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Attendify</title>
        <link rel="icon" href="/logo.png" type="image/png" />

        <!-- PWA -->
        <link rel="manifest" href="/manifest.json" />
        <meta name="theme-color" content="#050505" />

        <!-- Clerk Auth -->
        <script src="/auth/clerk.js"></script>

        <!-- Alpine.js for lightweight reactivity -->
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/css/style.css" />
        <style>
            #nprogress-bar {
                position: fixed;
                top: 0;
                left: 0;
                height: 2px;
                background: #ff3b3b;
                z-index: 9999;
                transition:
                    width 0.3s ease,
                    opacity 0.3s ease;
                width: 0%;
                opacity: 0;
            }
        </style>

        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            primary: "#ff3b3b",
                            "accent-red": "#ff4d4d",
                            "dark-red": "#7a0000",
                            "deep-bg": "#050505",
                            "card-bg": "#0d0d0d",
                            "border-color": "#1f1f1f",
                        },
                        fontFamily: {
                            display: ["Inter", "sans-serif"],
                        },
                        borderRadius: {
                            DEFAULT: "0.15rem",
                            lg: "0.25rem",
                            xl: "0.4rem",
                            full: "9999px",
                        },
                    },
                },
            };
        </script>
    </head>

    <body
        class="dark bg-deep-bg text-white font-display min-h-screen flex flex-col"
        x-data="dashboardData()"
        x-init="initData()"
    >
        <div id="nprogress-bar"></div>

        <!-- Header Navigation -->
        <header
            class="hidden md:flex items-center justify-between border-b border-border-color bg-deep-bg px-4 sm:px-10 py-4 sticky top-0 z-50"
        >
            <div class="flex items-center gap-4 sm:gap-10">
                <div class="flex items-center gap-3 text-primary">
                    <span class="material-symbols-outlined text-3xl font-black"
                        >analytics</span
                    >
                    <h2
                        class="text-white text-lg sm:text-xl font-black uppercase tracking-[0.2em] leading-tight hidden sm:block"
                    >
                        Attendify
                    </h2>
                </div>
            </div>

            <div
                class="flex flex-1 justify-end gap-4 sm:gap-6 sm:gap-10 items-center"
            >
                <nav class="hidden md:flex items-center gap-8">
                    <a
                        class="text-primary border-b border-primary py-1 text-[10px] sm:text-xs font-bold uppercase tracking-widest"
                        href="/"
                        onclick="
                            const b = document.getElementById('nprogress-bar');
                            b.style.opacity = '1';
                            b.style.width = '60%';
                        "
                        >Dashboard</a
                    >
                    <a
                        class="text-neutral-500 hover:text-white transition-all text-[10px] sm:text-xs font-bold uppercase tracking-widest"
                        href="/calendar"
                        onclick="
                            const b = document.getElementById('nprogress-bar');
                            b.style.opacity = '1';
                            b.style.width = '60%';
                        "
                        >Calendar</a
                    >
                    <a
                        class="text-neutral-500 hover:text-white transition-all text-[10px] sm:text-xs font-bold uppercase tracking-widest"
                        href="/calculator"
                        onclick="
                            const b = document.getElementById('nprogress-bar');
                            b.style.opacity = '1';
                            b.style.width = '60%';
                        "
                        >Calculator</a
                    >
                    <a
                        class="text-neutral-500 hover:text-white transition-all text-[10px] sm:text-xs font-bold uppercase tracking-widest"
                        href="/profile"
                        onclick="
                            const b = document.getElementById('nprogress-bar');
                            b.style.opacity = '1';
                            b.style.width = '60%';
                        "
                        >Profile</a
                    >
                </nav>
                <div class="hidden">
                    <div id="user-button"></div>
                </div>
            </div>
        </header>

        <!-- Mobile Bottom Nav -->
        <nav
            class="md:hidden fixed bottom-0 left-0 right-0 bg-deep-bg border-t border-border-color z-50 flex justify-around items-center pt-2 pb-4 px-2 shadow-[0_-10px_40px_rgba(0,0,0,0.8)]"
        >
            <a
                href="/"
                class="flex flex-col items-center gap-1 p-2 text-primary"
                onclick="
                    const b = document.getElementById('nprogress-bar');
                    b.style.opacity = '1';
                    b.style.width = '60%';
                "
            >
                <span class="material-symbols-outlined text-[24px]">home</span>
                <span class="text-[9px] font-black uppercase tracking-widest"
                    >Home</span
                >
            </a>
            <a
                href="/calendar"
                class="flex flex-col items-center gap-1 p-2 text-neutral-500 hover:text-white transition-colors"
                onclick="
                    const b = document.getElementById('nprogress-bar');
                    b.style.opacity = '1';
                    b.style.width = '60%';
                "
            >
                <span class="material-symbols-outlined text-[24px]"
                    >calendar_month</span
                >
                <span class="text-[9px] font-black uppercase tracking-widest"
                    >Calendar</span
                >
            </a>
            <a
                href="/calculator"
                class="flex flex-col items-center gap-1 p-2 text-neutral-500 hover:text-white transition-colors"
                onclick="
                    const b = document.getElementById('nprogress-bar');
                    b.style.opacity = '1';
                    b.style.width = '60%';
                "
            >
                <span class="material-symbols-outlined text-[24px]"
                    >calculate</span
                >
                <span class="text-[9px] font-black uppercase tracking-widest"
                    >Calculator</span
                >
            </a>
            <a
                href="/profile"
                class="flex flex-col items-center gap-1 p-2 text-neutral-500 hover:text-white transition-colors"
                onclick="
                    const b = document.getElementById('nprogress-bar');
                    b.style.opacity = '1';
                    b.style.width = '60%';
                "
            >
                <span class="material-symbols-outlined text-[24px]"
                    >person</span
                >
                <span class="text-[9px] font-black uppercase tracking-widest"
                    >Profile</span
                >
            </a>
        </nav>

        <!-- Main Content -->
        <main
            class="flex-1 w-full max-w-[1280px] mx-auto px-4 sm:px-10 pt-4 sm:pt-10 pb-24 md:pb-10 relative"
            id="main-content"
            style="opacity: 0; transition: opacity 0.5s ease"
        >
            <!-- Hero Section -->
            <div
                class="flex flex-col sm:flex-row sm:items-center justify-between gap-4"
            >
                <div>
                    <h1
                        class="text-white text-3xl sm:text-5xl font-black leading-none tracking-tighter uppercase"
                        x-text="stats.profile && stats.profile.name ? 'HELLO, ' + stats.profile.name.split(' ')[0] : 'OVERVIEW'"
                    >
                        OVERVIEW
                    </h1>
                </div>
                <!-- Mass Bunk Action -->
                <button
                    @click="massBunk()"
                    class="group relative overflow-hidden bg-white/5 border border-border-color hover:border-primary/50 text-white px-6 py-3 rounded flex items-center gap-3 transition-all"
                >
                    <div class="flex flex-col items-start">
                        <span
                            class="text-[10px] font-black uppercase tracking-[0.2em] text-neutral-500 group-hover:text-primary transition-colors"
                            >Emergency Mark</span
                        >
                        <span
                            class="text-xs font-black uppercase tracking-widest"
                            >Mass Bunk Today</span
                        >
                    </div>
                    <span
                        class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform"
                        >event_busy</span
                    >
                </button>
            </div>
            <br />

            <!-- Global Stats Row -->
            <div
                class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 sm:gap-6 mb-8 sm:mb-12"
            >
                <div
                    class="flex flex flex-col gap-2 sm:gap-4 rounded bg-card-bg border border-border-color p-4 sm:p-6 neo-shadow relative overflow-hidden"
                >
                    <p
                        class="text-neutral-500 text-[10px] font-black uppercase tracking-widest"
                    >
                        Global Attendance
                    </p>
                    <div class="flex items-baseline gap-2">
                        <p
                            class="text-white text-3xl sm:text-4xl font-black"
                            x-text="stats.overall_percentage"
                        >
                            --<span class="text-primary">%</span>
                        </p>
                    </div>
                    <div class="w-full bg-neutral-900 h-[2px] mt-2">
                        <div
                            class="bg-primary h-full transition-all duration-1000"
                            :class="{ 'indicator-pulse': stats.overall_percentage >= (stats.profile?.attendance_requirement_percentage ?? 75) }"
                            :style="`width: ${stats.overall_percentage}%`"
                        ></div>
                    </div>
                </div>

                <div
                    class="flex flex flex-col gap-2 sm:gap-4 rounded bg-card-bg border border-border-color p-4 sm:p-6 neo-shadow"
                    :class="statusColorClass(stats.overall_status)"
                >
                    <p
                        class="text-neutral-500 text-[10px] font-black uppercase tracking-widest"
                    >
                        Global Status
                    </p>
                    <div class="flex items-center gap-3">
                        <p
                            class="text-white text-3xl font-black uppercase"
                            x-text="stats.overall_status"
                        >
                            --
                        </p>
                        <span
                            class="material-symbols-outlined text-3xl"
                            x-text="statusIcon(stats.overall_status)"
                        ></span>
                    </div>
                </div>

                <div
                    class="flex flex flex-col gap-2 sm:gap-4 rounded bg-card-bg border border-border-color p-4 sm:p-6 neo-shadow"
                >
                    <p
                        class="text-neutral-500 text-[10px] font-black uppercase tracking-widest"
                    >
                        Total Classes
                    </p>
                    <div class="flex items-baseline gap-2">
                        <p
                            class="text-white text-3xl sm:text-4xl font-black"
                            x-text="stats.total_classes"
                        >
                            --
                        </p>
                    </div>
                </div>

                <div
                    class="flex flex flex-col gap-2 sm:gap-4 rounded bg-card-bg border border-border-color p-4 sm:p-6 neo-shadow"
                >
                    <p
                        class="text-neutral-500 text-[10px] font-black uppercase tracking-widest"
                    >
                        Total Attended
                    </p>
                    <div class="flex items-baseline gap-2">
                        <p
                            class="text-white text-3xl sm:text-4xl font-black text-primary"
                            x-text="stats.total_attended"
                        >
                            --
                        </p>
                    </div>
                </div>
            </div>

            <!-- Subjects Grid -->
            <div class="mb-6 flex justify-between items-end">
                <h3
                    class="text-white text-sm font-black uppercase tracking-[0.2em] border-l-2 border-primary pl-3"
                >
                    Your Subjects
                </h3>
                <button
                    @click="openModal()"
                    class="text-primary text-[10px] font-bold uppercase tracking-widest hover:brightness-125 transition-all flex items-center gap-1"
                >
                    <span class="material-symbols-outlined text-sm">add</span>
                    Add Subject
                </button>
            </div>

            <template x-if="loading">
                <div
                    class="flex overflow-x-auto snap-x snap-mandatory gap-6 pb-4 no-scrollbar"
                >
                    <!-- Skeleton Card 1 -->
                    <div
                        class="flex-shrink-0 w-[85vw] md:w-auto md:flex-shrink snap-center rounded bg-card-bg border border-border-color p-6 neo-shadow"
                    >
                        <div class="animate-pulse space-y-4">
                            <div class="flex justify-between">
                                <div>
                                    <div
                                        class="h-6 bg-neutral-800 rounded w-3/4 mb-2"
                                    ></div>
                                    <div
                                        class="h-3 bg-neutral-800 rounded w-1/2"
                                    ></div>
                                </div>
                                <div
                                    class="h-6 w-12 bg-neutral-800 rounded"
                                ></div>
                            </div>
                            <div
                                class="h-2 bg-neutral-800 rounded-full mt-6 mb-4"
                            ></div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="h-10 bg-neutral-800 rounded"></div>
                                <div class="h-10 bg-neutral-800 rounded"></div>
                            </div>
                            <div class="flex gap-2 mt-4">
                                <div
                                    class="h-10 grow bg-neutral-800 rounded"
                                ></div>
                                <div
                                    class="h-10 grow bg-neutral-800 rounded"
                                ></div>
                                <div
                                    class="h-10 grow bg-neutral-800 rounded"
                                ></div>
                            </div>
                        </div>
                    </div>
                    <!-- Skeleton Card 2 -->
                    <div
                        class="flex-shrink-0 w-[85vw] md:w-auto md:flex-shrink snap-center rounded bg-card-bg border border-border-color p-6 neo-shadow"
                    >
                        <div class="animate-pulse space-y-4">
                            <div class="flex justify-between">
                                <div>
                                    <div
                                        class="h-6 bg-neutral-800 rounded w-3/4 mb-2"
                                    ></div>
                                    <div
                                        class="h-3 bg-neutral-800 rounded w-1/2"
                                    ></div>
                                </div>
                                <div
                                    class="h-6 w-12 bg-neutral-800 rounded"
                                ></div>
                            </div>
                            <div
                                class="h-2 bg-neutral-800 rounded-full mt-6 mb-4"
                            ></div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="h-10 bg-neutral-800 rounded"></div>
                                <div class="h-10 bg-neutral-800 rounded"></div>
                            </div>
                            <div class="flex gap-2 mt-4">
                                <div
                                    class="h-10 grow bg-neutral-800 rounded"
                                ></div>
                                <div
                                    class="h-10 grow bg-neutral-800 rounded"
                                ></div>
                                <div
                                    class="h-10 grow bg-neutral-800 rounded"
                                ></div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="!loading && stats.subjects.length === 0">
                <div
                    class="rounded border border-dashed border-border-color p-10 flex flex-col items-center justify-center gap-4"
                >
                    <span
                        class="material-symbols-outlined text-4xl text-neutral-600"
                        >playlist_add</span
                    >
                    <p class="text-neutral-400 text-sm">
                        No subjects found. Start by enrolling in subjects.
                    </p>
                    <button
                        @click="openModal()"
                        class="mt-2 px-6 py-2 bg-primary text-white font-bold text-xs rounded uppercase tracking-widest shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all"
                    >
                        Add Subject
                    </button>
                </div>
            </template>

            <div
                class="flex md:grid md:grid-cols-2 xl:grid-cols-3 overflow-x-auto md:overflow-visible snap-x snap-mandatory gap-4 sm:gap-6 pb-4 no-scrollbar"
                x-show="!loading && stats.subjects.length > 0"
            >
                <!-- Loop through subjects -->
                <template x-for="subject in stats.subjects" :key="subject.id">
                    <div
                        class="flex-shrink-0 w-[85vw] md:w-auto md:flex-shrink snap-center rounded bg-card-bg border border-border-color p-4 sm:p-6 neo-shadow flex flex-col hover:border-primary/50 transition-all group"
                    >
                        <div class="flex justify-between items-start mb-4">
                            <div
                                class="flex-1 w-full max-w-[200px] sm:max-w-[250px]"
                            >
                                <div class="flex items-center gap-2 mb-1">
                                    <h4
                                        class="font-black text-lg text-white uppercase tracking-wider truncate max-w-[120px] sm:max-w-none"
                                        x-text="subject.subject_name"
                                    ></h4>
                                    <span
                                        class="px-2 py-0.5 rounded text-[9px] font-black uppercase tracking-widest border whitespace-nowrap"
                                        :class="window.calculateWhatIf(subject).color"
                                        x-text="window.calculateWhatIf(subject).text"
                                    ></span>
                                </div>
                                <p
                                    class="text-xs text-neutral-500 font-medium tracking-tight mt-1 truncate"
                                    x-text="subject.faculty_name || 'No Faculty'"
                                ></p>
                            </div>
                            <div class="text-right">
                                <span
                                    class="text-2xl font-black"
                                    :class="percentageColor(subject.current_percentage, subject.min_requirement_percentage)"
                                    x-text="subject.current_percentage + '%'"
                                ></span>
                                <p
                                    class="text-[10px] text-neutral-500 font-bold uppercase tracking-tighter"
                                    x-text="'REQ ' + subject.min_requirement_percentage + '%'"
                                ></p>
                            </div>
                        </div>

                        <div
                            class="flex justify-between text-xs text-neutral-400 mb-2 font-bold uppercase tracking-wider"
                        >
                            <span
                                ><span
                                    class="text-white"
                                    x-text="subject.attended_classes"
                                ></span>
                                Attended</span
                            >
                            <span
                                ><span
                                    class="text-white"
                                    x-text="subject.total_classes"
                                ></span>
                                Total</span
                            >
                        </div>

                        <div
                            class="w-full bg-neutral-900 h-1.5 rounded-full mb-6 overflow-hidden"
                        >
                            <div
                                class="h-full transition-all"
                                :class="bgPercentageColor(subject.current_percentage, subject.min_requirement_percentage)"
                                :style="`width: ${subject.current_percentage}%`"
                            ></div>
                        </div>

                        <!-- Quick Marks Actions -->
                        <div
                            class="mt-auto h-[120px] flex flex-col justify-end relative"
                        >
                            <!-- Default Action Buttons (Shows if scheduled and NOT marked today) -->
                            <div
                                x-show="isSubjectScheduledToday(subject.id) && !isSubjectMarkedToday(subject.id)"
                                class="grid grid-cols-3 gap-2"
                            >
                                <button
                                    @click="markAttendance(subject.id, 'present')"
                                    class="flex flex-col items-center justify-center py-2 bg-white/5 hover:bg-green-500/20 hover:text-green-500 border border-transparent hover:border-green-500/50 rounded transition-all text-neutral-400"
                                >
                                    <span
                                        class="material-symbols-outlined text-lg mb-1"
                                        >check_circle</span
                                    >
                                    <span
                                        class="text-[9px] font-black uppercase tracking-widest"
                                        >Present</span
                                    >
                                </button>
                                <button
                                    @click="markAttendance(subject.id, 'absent')"
                                    class="flex flex-col items-center justify-center py-2 bg-white/5 hover:bg-primary/20 hover:text-primary border border-transparent hover:border-primary/50 rounded transition-all text-neutral-400"
                                >
                                    <span
                                        class="material-symbols-outlined text-lg mb-1"
                                        >cancel</span
                                    >
                                    <span
                                        class="text-[9px] font-black uppercase tracking-widest"
                                        >Absent</span
                                    >
                                </button>
                                <button
                                    @click="markAttendance(subject.id, 'extra')"
                                    class="flex flex-col items-center justify-center py-2 bg-white/5 hover:bg-blue-500/20 hover:text-blue-500 border border-transparent hover:border-blue-500/50 rounded transition-all text-neutral-400"
                                >
                                    <span
                                        class="material-symbols-outlined text-lg mb-1"
                                        >add_circle</span
                                    >
                                    <span
                                        class="text-[9px] font-black uppercase tracking-widest"
                                        >Extra</span
                                    >
                                </button>
                                <button
                                    x-show="isSubjectScheduledToday(subject.id)"
                                    @click="massBunkSubject(subject.id, subject.subject_name)"
                                    class="col-span-3 flex items-center justify-center gap-2 py-2 mt-1 bg-white/5 hover:bg-orange-500/20 hover:text-orange-500 border border-transparent hover:border-orange-500/50 rounded transition-all text-neutral-400"
                                >
                                    <span
                                        class="material-symbols-outlined text-lg"
                                        >event_busy</span
                                    >
                                    <span
                                        class="text-[9px] font-black uppercase tracking-widest"
                                        >Bunk Today's Class</span
                                    >
                                </button>
                            </div>

                            <!-- Marked Today State (Shows if marked today) -->
                            <div
                                x-show="isSubjectMarkedToday(subject.id)"
                                style="display: none"
                                class="flex flex-col gap-2 p-3 bg-neutral-900/50 border border-border-color rounded relative group"
                            >
                                <div class="flex items-center gap-2 text-white">
                                    <span
                                        class="material-symbols-outlined text-green-500 text-sm"
                                        >verified</span
                                    >
                                    <span
                                        class="text-[10px] font-black uppercase tracking-widest"
                                        >Action Recorded</span
                                    >
                                </div>
                                <span
                                    class="text-xs text-neutral-400 font-medium"
                                    >You have already marked attendance for this
                                    subject today.</span
                                >
                                <button
                                    @click="revokeTodayRecords(subject.id)"
                                    class="absolute top-3 right-3 text-neutral-500 hover:text-primary transition-colors flex items-center gap-1 group/revoke"
                                    title="Revoke Today's Action"
                                >
                                    <span
                                        class="text-[9px] font-black uppercase tracking-widest opacity-0 group-hover/revoke:opacity-100 transition-opacity"
                                        >Revoke</span
                                    >
                                    <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        class="w-4 h-4"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2.5"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    >
                                        <path
                                            d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"
                                        ></path>
                                        <path d="M3 3v5h5"></path>
                                    </svg>
                                </button>
                            </div>

                            <!-- Empty State (Shows if NOT scheduled and NOT marked today) -->
                            <div
                                x-show="!isSubjectScheduledToday(subject.id) && !isSubjectMarkedToday(subject.id)"
                                style="display: none"
                                class="absolute inset-0 flex flex-col items-center justify-center gap-2"
                            >
                                <span
                                    class="text-[11px] font-black uppercase tracking-[0.4em] text-neutral-600"
                                    >No Class Today</span
                                >
                                <a
                                    href="/profile"
                                    class="text-[9px] font-bold uppercase tracking-widest text-neutral-700 hover:text-primary transition-colors flex items-center gap-1"
                                    onclick="
                                        const b =
                                            document.getElementById(
                                                'nprogress-bar',
                                            );
                                        b.style.opacity = '1';
                                        b.style.width = '60%';
                                    "
                                >
                                    <span
                                        class="material-symbols-outlined text-[12px]"
                                        >add_circle</span
                                    >
                                    Add to timetable
                                </a>
                            </div>
                        </div>

                        <div
                            class="mt-4 pt-3 border-t border-border-color flex items-center justify-between"
                        >
                            <a
                                :href="`/subject-details?id=${subject.id}`"
                                class="text-[10px] text-neutral-500 hover:text-primary font-bold uppercase tracking-widest flex items-center gap-1 transition-colors"
                            >
                                View Details
                                <span class="material-symbols-outlined text-sm"
                                    >arrow_forward</span
                                >
                            </a>
                            <div class="flex items-center gap-1">
                                <button
                                    @click="editModal(subject)"
                                    class="p-1.5 text-neutral-600 hover:text-white hover:bg-white/10 rounded transition-all"
                                    title="Edit Subject"
                                >
                                    <span
                                        class="material-symbols-outlined text-[18px]"
                                        >edit</span
                                    >
                                </button>
                                <button
                                    @click="deleteSubject(subject.id, subject.subject_name)"
                                    class="p-1.5 text-neutral-600 hover:text-primary hover:bg-primary/10 rounded transition-all"
                                    title="Delete Subject"
                                >
                                    <span
                                        class="material-symbols-outlined text-[18px]"
                                        >delete</span
                                    >
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Modal for Add/Edit Subject -->
            <div
                x-show="isModalOpen"
                x-cloak
                class="fixed inset-0 z-50 flex items-center justify-center p-4"
            >
                <!-- Backdrop -->
                <div
                    class="fixed inset-0 bg-black/80 backdrop-blur-sm transition-opacity"
                    @click="closeModal()"
                ></div>

                <!-- Modal Panel -->
                <div
                    class="bg-card-bg border border-border-color rounded-xl neo-shadow w-full max-w-lg z-10 overflow-hidden transform transition-all border-t-2 border-t-primary"
                >
                    <div
                        class="px-6 py-5 border-b border-border-color flex justify-between items-center bg-white/5"
                    >
                        <h3
                            class="text-sm font-black text-white uppercase tracking-widest"
                            x-text="isEdit ? 'Update Subject' : 'Add New Subject'"
                        ></h3>
                        <button
                            @click="closeModal()"
                            class="text-neutral-500 hover:text-white transition-colors"
                        >
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>

                    <form @submit.prevent="saveSubject" class="p-6">
                        <div class="space-y-4">
                            <div>
                                <label
                                    class="block text-[10px] font-black text-neutral-500 mb-2 uppercase tracking-widest"
                                    >Subject Name *</label
                                >
                                <input
                                    x-model="formData.subject_name"
                                    required
                                    type="text"
                                    class="w-full rounded bg-deep-bg text-white border border-border-color focus:ring-1 focus:ring-primary focus:border-primary px-4 py-3 text-xs uppercase"
                                    placeholder="e.g. Computer Science"
                                />
                            </div>
                            <div>
                                <label
                                    class="block text-[10px] font-black text-neutral-500 mb-2 uppercase tracking-widest"
                                    >Faculty Name</label
                                >
                                <input
                                    x-model="formData.faculty_name"
                                    type="text"
                                    class="w-full rounded bg-deep-bg text-white border border-border-color focus:ring-1 focus:ring-primary focus:border-primary px-4 py-3 text-xs uppercase"
                                    placeholder="e.g. Dr. Smith"
                                />
                            </div>

                            <div>
                                <label
                                    class="block text-[10px] font-black text-neutral-500 mb-2 uppercase tracking-widest"
                                    >Required %</label
                                >
                                <input
                                    x-model.number="formData.min_requirement_percentage"
                                    type="number"
                                    step="0.1"
                                    min="0"
                                    max="100"
                                    class="w-full rounded bg-deep-bg text-white border border-border-color focus:ring-1 focus:ring-primary focus:border-primary px-4 py-3 text-xs"
                                    placeholder="75.0"
                                />
                            </div>
                        </div>

                        <div class="mt-8 flex gap-3 flex-row-reverse">
                            <button
                                type="submit"
                                class="px-6 py-3 bg-primary text-white text-xs font-black rounded hover:brightness-110 uppercase tracking-widest shadow-lg shadow-primary/20 transition-all"
                                x-text="isEdit ? 'Save Changes' : 'Create Subject'"
                            ></button>
                            <button
                                type="button"
                                @click="closeModal()"
                                class="px-6 py-3 bg-white/5 border border-border-color text-neutral-400 text-xs font-bold rounded hover:bg-white/10 uppercase tracking-widest transition-all"
                            >
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <!-- <footer class="mt-auto py-8 border-t border-border-color bg-deep-bg text-center">
        <p class="text-neutral-700 text-[9px] font-black uppercase tracking-widest">Attendify System Setup</p>
    </footer> -->

        <script src="/js/main.js"></script>
        <script>
            document.addEventListener("alpine:init", () => {
                Alpine.data("dashboardData", () => ({
                    loading: true,
                    mobileMenuOpen: false,
                    stats: {
                        profile: null,
                        overall_percentage: 0,
                        overall_status: "loading",
                        subjects: [],
                        total_classes: 0,
                        total_attended: 0,
                    },
                    timetable: [],

                    // Subject Management Modal State
                    isModalOpen: false,
                    isEdit: false,
                    editId: null,
                    formData: {
                        subject_name: "",
                        faculty_name: "",
                        attended_classes: 0,
                        total_classes: 0,
                        min_requirement_percentage: 75.0,
                    },

                    async initData() {
                        window.addEventListener("load", async () => {
                            const clerk = await window.waitForClerk();
                            if (!clerk) {
                                this.loading = false;
                                return;
                            }
                            const userButtonDiv =
                                document.getElementById("user-button");
                            if (clerk.user) {
                                clerk.mountUserButton(userButtonDiv);
                                document.getElementById(
                                    "main-content",
                                ).style.opacity = "1";
                                const bar =
                                    document.getElementById("nprogress-bar");
                                bar.style.opacity = "1";
                                bar.style.width = "70%";
                                await this.fetchDashboard();
                                await this.fetchTimetable();
                                // Expose refresh hook for geo.js auto-attendance
                                window.__attendifyRefresh = () =>
                                    this.fetchDashboard();
                            } else {
                                window.location.href = "/sign-in";
                            }
                        });
                    },

                    async fetchTimetable() {
                        try {
                            const res = await fetch("/api/timetable");
                            this.timetable = await res.json();
                        } catch (e) {
                            console.error("Timetable fetch failed", e);
                        }
                    },

                    openModal() {
                        this.isEdit = false;
                        this.editId = null;
                        this.formData = {
                            subject_name: "",
                            faculty_name: "",
                            attended_classes: 0,
                            total_classes: 0,
                            min_requirement_percentage: this.stats.profile
                                ? this.stats.profile
                                      .attendance_requirement_percentage
                                : 75.0,
                        };
                        this.isModalOpen = true;
                    },

                    editModal(subject) {
                        this.isEdit = true;
                        this.editId = subject.id;
                        this.formData = {
                            subject_name: subject.subject_name,
                            faculty_name: subject.faculty_name || "",
                            attended_classes: subject.attended_classes,
                            total_classes: subject.total_classes,
                            min_requirement_percentage:
                                subject.min_requirement_percentage,
                        };
                        this.isModalOpen = true;
                    },

                    closeModal() {
                        this.isModalOpen = false;
                    },

                    async saveSubject() {
                        if (!this.formData.subject_name) {
                            window.showToast(
                                "Please enter a subject name",
                                "error",
                            );
                            return;
                        }

                        let url = "/api/subjects";
                        let method = "POST";
                        if (this.isEdit) {
                            url = `/api/subjects/${this.editId}`;
                            method = "PUT";
                        }

                        try {
                            const res = await fetch(url, {
                                method,
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(this.formData),
                            });

                            if (res.ok) {
                                window.showToast(
                                    this.isEdit
                                        ? "Subject Updated"
                                        : "Subject Created",
                                    "success",
                                );
                                this.closeModal();
                                await this.fetchDashboard(); // Refresh dashboard data magically
                            } else {
                                const err = await res.json();
                                window.showToast(
                                    "Error saving subject: " + err.error,
                                    "error",
                                );
                            }
                        } catch (e) {
                            console.error("Error calling api:", e);
                            window.showToast("Communication Error", "error");
                        }
                    },

                    isSubjectScheduledToday(subjectId) {
                        if (!this.timetable || this.timetable.length === 0)
                            return false;
                        const days = [
                            "sunday",
                            "monday",
                            "tuesday",
                            "wednesday",
                            "thursday",
                            "friday",
                            "saturday",
                        ];
                        const todayName = days[new Date().getDay()];
                        return this.timetable.some(
                            (s) =>
                                s.day.toLowerCase() === todayName &&
                                s.subjectId === subjectId.toString(),
                        );
                    },

                    async massBunkSubject(subjectId, subjectName) {
                        if (
                            !confirm(
                                `Are you sure you want to bunk ALL of today's slots for ${subjectName}?`,
                            )
                        )
                            return;

                        const days = [
                            "sunday",
                            "monday",
                            "tuesday",
                            "wednesday",
                            "thursday",
                            "friday",
                            "saturday",
                        ];
                        const todayName = days[new Date().getDay()];

                        // Find how many slots this subject has today
                        const slotsToday = this.timetable.filter(
                            (s) =>
                                s.day.toLowerCase() === todayName &&
                                s.subjectId === subjectId.toString(),
                        );

                        if (slotsToday.length === 0) {
                            showToast(
                                "No slots scheduled today for this subject.",
                                "info",
                            );
                            return;
                        }

                        const today = window.getLocalDateString();
                        showToast(
                            `Bunking ${slotsToday.length} slot(s)...`,
                            "info",
                        );

                        try {
                            // Mark as absent X times (where X is the number of slots today)
                            await Promise.all(
                                slotsToday.map(() =>
                                    fetch("/api/attendance/mark", {
                                        method: "POST",
                                        headers: {
                                            "Content-Type": "application/json",
                                        },
                                        body: JSON.stringify({
                                            subjectId,
                                            status: "absent",
                                            date: today,
                                        }),
                                    }),
                                ),
                            );

                            showToast("Slots bunked successfully!", "success");
                            await this.fetchDashboard();
                        } catch (e) {
                            console.error("Bunk failed", e);
                            showToast("Error saving bunk", "error");
                        }
                    },

                    async massBunk() {
                        if (
                            !confirm(
                                "Are you sure you want to mark all subjects scheduled for today as ABSENT?",
                            )
                        )
                            return;

                        const days = [
                            "sunday",
                            "monday",
                            "tuesday",
                            "wednesday",
                            "thursday",
                            "friday",
                            "saturday",
                        ];
                        const todayName = days[new Date().getDay()];

                        const todaySlots = this.timetable.filter(
                            (s) => s.day.toLowerCase() === todayName,
                        );

                        if (todaySlots.length === 0) {
                            showToast("No classes scheduled for today", "info");
                            return;
                        }

                        // Get unique subject IDs from today's slots
                        const subjectIds = [
                            ...new Set(todaySlots.map((s) => s.subjectId)),
                        ];
                        const today = window.getLocalDateString();

                        showToast(
                            `Bunking ${subjectIds.length} subjects...`,
                            "info",
                        );
                        if (navigator.vibrate) navigator.vibrate([50, 100, 50]);

                        try {
                            // Mark all as absent
                            await Promise.all(
                                subjectIds.map((subjectId) =>
                                    fetch("/api/attendance/mark", {
                                        method: "POST",
                                        headers: {
                                            "Content-Type": "application/json",
                                        },
                                        body: JSON.stringify({
                                            subjectId,
                                            status: "absent",
                                            date: today,
                                        }),
                                    }),
                                ),
                            );

                            showToast("Mass Bunk Recorded!", "success");
                            await this.fetchDashboard();
                        } catch (e) {
                            console.error("Mass bunk failed", e);
                            showToast("Error during mass bunk", "error");
                        }
                    },

                    async fetchDashboard() {
                        this.loading = true;
                        try {
                            const response = await fetch("/api/dashboard");
                            const data = await response.json();

                            // We need the raw history from /api/subjects to verify dates
                            const subjectsRes = await fetch("/api/subjects");
                            const rawSubjects = await subjectsRes.json();

                            this.stats = {
                                ...data,
                                subjects: data.subjects.map((analyzedSub) => {
                                    const rawSub = rawSubjects.find(
                                        (s) => s.id === analyzedSub.id,
                                    );
                                    return {
                                        ...analyzedSub,
                                        history: rawSub ? rawSub.history : [],
                                    };
                                }),
                            };
                        } catch (err) {
                            console.error(err);
                        } finally {
                            this.loading = false;
                            const bar =
                                document.getElementById("nprogress-bar");
                            bar.style.width = "100%";
                            setTimeout(() => {
                                bar.style.opacity = "0";
                                bar.style.width = "0%";
                            }, 400);
                        }
                    },

                    isSubjectMarkedToday(subjectId) {
                        if (!this.stats || !this.stats.subjects) return false;
                        const subject = this.stats.subjects.find(
                            (s) => s.id === subjectId.toString(),
                        );
                        if (!subject || !subject.history) return false;

                        const todayPrefix = new Date()
                            .toISOString()
                            .split("T")[0];
                        return subject.history.some((record) =>
                            record.date.startsWith(todayPrefix),
                        );
                    },

                    async revokeTodayRecords(subjectId, skipConfirm = false) {
                        const subject = this.stats.subjects.find(
                            (s) => s.id === subjectId.toString(),
                        );
                        if (!subject || !subject.history) return;

                        const todayPrefix = new Date()
                            .toISOString()
                            .split("T")[0];
                        const todayRecords = subject.history.filter((record) =>
                            record.date.startsWith(todayPrefix),
                        );

                        if (todayRecords.length === 0) return;

                        if (
                            !skipConfirm &&
                            !confirm(
                                "Are you sure you want to revoke today's actions for this subject ?",
                            )
                        )
                            return;

                        try {
                            await Promise.all(
                                todayRecords.map((record) =>
                                    fetch(
                                        `/api/attendance/${subjectId}/${record.id}`,
                                        { method: "DELETE" },
                                    ),
                                ),
                            );
                            showToast(
                                "Actions revoked successfully",
                                "success",
                            );
                            await this.fetchDashboard();
                        } catch (e) {
                            console.error("Error revoking records", e);
                            showToast("Error revoking actions", "error");
                        }
                    },

                    async markAttendance(subjectId, status) {
                        if (status === "absent" && navigator.vibrate)
                            navigator.vibrate([20, 50, 20]);
                        else if (status !== "absent" && navigator.vibrate)
                            navigator.vibrate(10);

                        const today = window.getLocalDateString();
                        try {
                            const res = await fetch("/api/attendance/mark", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    subjectId,
                                    status,
                                    date: today,
                                }),
                            });
                            if (res.ok) {
                                showToast(
                                    "Attendance Marked Successfully",
                                    "success",
                                    () => {
                                        this.revokeTodayRecords(
                                            subjectId,
                                            true,
                                        ); // true for silent mode if we want, or just let it prompt. Wait, undo shouldn't prompt. Let's pass true to skip confirm.
                                    },
                                    "Undo",
                                );
                                await this.fetchDashboard();
                            } else {
                                showToast("Failed to mark attendance", "error");
                            }
                        } catch (e) {
                            console.error("Failed to mark", e);
                            showToast("Communication Error", "error");
                        }
                    },

                    async deleteSubject(subjectId, subjectName) {
                        if (
                            !confirm(
                                `Delete "${subjectName}"? All attendance records will be permanently lost.`,
                            )
                        )
                            return;
                        try {
                            const res = await fetch(
                                `/api/subjects/${subjectId}`,
                                { method: "DELETE" },
                            );
                            if (res.ok) {
                                window.showToast("Subject deleted", "success");
                                await this.fetchDashboard();
                            } else {
                                window.showToast(
                                    "Failed to delete subject",
                                    "error",
                                );
                            }
                        } catch (e) {
                            console.error("Delete error", e);
                            window.showToast("Communication Error", "error");
                        }
                    },

                    percentageColor(val, req) {
                        if (val >= req) return "text-white";
                        if (val >= req - 5) return "text-orange-500";
                        return "text-primary";
                    },

                    bgPercentageColor(val, req) {
                        if (val >= req) return "bg-white/80";
                        if (val >= req - 5) return "bg-orange-500";
                        return "bg-primary";
                    },

                    statusColorClass(status) {
                        if (status === "safe")
                            return "border-l-2 border-l-green-500 text-green-500";
                        if (status === "warning")
                            return "border-l-2 border-l-orange-500 text-orange-500";
                        return "border-l-2 border-l-primary text-primary";
                    },

                    statusIcon(status) {
                        if (status === "safe") return "check_circle";
                        if (status === "warning") return "warning";
                        return "error";
                    },
                }));
            });
        </script>
        <!-- Toast container - fixed popup below any header -->
        <div
            id="toast-container"
            class="fixed top-20 right-4 z-[9999] flex flex-col gap-2 pointer-events-none w-72 max-w-[calc(100vw-2rem)]"
        ></div>
        <script src="/js/geo.js"></script>
